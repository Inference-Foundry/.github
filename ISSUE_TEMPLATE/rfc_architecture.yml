name: "RFC: Architecture Proposal"
description: Propose a substantive architectural change to super-ollama. This template is for changes to the inference path, CGo bridge, ggml backend, memory management, or signal handling. Cosmetic or documentation-only changes do not need an RFC.
title: "RFC: "
labels: ["rfc", "architecture", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## RFC Acceptance Criteria
        RFCs that do not include a quantified problem statement, a concrete low-level implementation sketch, and an estimated performance impact will be closed as incomplete.
        Vague proposals ("make it faster", "reduce memory usage") without profiling data identifying the specific bottleneck are not actionable and will be rejected.

  - type: textarea
    id: problem_statement
    attributes:
      label: Problem Statement
      description: |
        What specific bottleneck, overhead, or correctness issue is this RFC eliminating?
        Be precise: name the code path, identify the bottleneck with profiling data or a reproducible measurement, and quantify the current cost.
        Do not describe a general goal — describe a measurable problem with evidence.
      placeholder: |
        The current CGo bridge calls llama_decode() once per token during autoregressive generation, crossing the CGo boundary on every iteration. On a 4090 at 4096-token context, this contributes ~18 µs/token of overhead (measured via pprof CPU profile, attached), representing ~12% of total generation time at 30 T/s.

        Profiler evidence: [attach pprof SVG or nsight trace]
    validations:
      required: true

  - type: textarea
    id: proposed_implementation
    attributes:
      label: Proposed Low-Level Implementation
      description: |
        Describe how this change interacts with `ggml`, `llama.cpp`, the Go runtime, or the CGo boundary.
        Be specific about:
        - Which C/C++ functions or `ggml` ops are added, replaced, or removed.
        - How Go-side memory is managed across the boundary (pinning, ownership transfer).
        - Any changes to the `ggml_context` or `ggml_backend` lifecycle.
        - Any changes to signal handling or teardown ordering.
        Pseudocode or API sketches are appropriate here — but explain the mechanism, not just the interface.
      placeholder: |
        Propose batching token embeddings: instead of calling llama_decode(ctx, batch_of_1) per token, accumulate tokens in a Go-side ring buffer and call llama_decode(ctx, batch_of_N) when the buffer reaches capacity or a flush condition is met (EOS, context full, caller drain).

        C side: no ggml API changes needed; llama_batch already supports N > 1.
        Go side: introduce a BatchEncoder struct holding a pinned C.llama_batch. The struct is initialized once and reused across decode calls, eliminating per-token C.malloc overhead.
        Ownership: llama_batch.token and llama_batch.pos are C-heap arrays allocated once at BatchEncoder construction and freed in its Close() method, called from the existing SIGTERM teardown path.
    validations:
      required: true

  - type: textarea
    id: theoretical_impact
    attributes:
      label: Theoretical Performance Impact
      description: |
        Provide an estimated or measured impact on one or more of the following:
        - CGo boundary crossing frequency (crossings/token)
        - Memory bandwidth utilization (GB/s)
        - Context-switch latency between Go runtime and C (µs)
        - VRAM footprint delta (MiB)
        - Inference latency (ms/token) or throughput (T/s)

        If you have implemented a prototype, include before/after benchmark numbers here.
        If this is a theoretical proposal, provide a reasoned estimate and explain the assumptions.
      placeholder: |
        Estimated CGo crossings: reduced from 1/token to ~1/N tokens (target N=8–16).
        Expected latency reduction: ~10–15% at 30 T/s on CUDA backend (18 µs × reduction_factor).
        VRAM delta: +2 MiB for the pre-allocated llama_batch arrays (negligible vs. KV cache).
        No change to memory bandwidth — the same compute work happens; only dispatch overhead is reduced.
    validations:
      required: true

  - type: textarea
    id: affected_subsystems
    attributes:
      label: Affected Subsystems
      description: List the files, packages, or components that will change. This helps maintainers identify the correct reviewers.
      placeholder: |
        - internal/llama/bridge.go (CGo boundary, BatchEncoder)
        - internal/llama/llama.h (no changes expected)
        - internal/scheduler/decode.go (call site refactor)
        - Signal teardown path in cmd/super-ollama/main.go (BatchEncoder.Close registration)
    validations:
      required: true

  - type: dropdown
    id: rfc_scope
    attributes:
      label: RFC Scope
      description: Select the primary subsystem this RFC targets.
      options:
        - CGo bridge / language boundary
        - ggml compute kernels
        - Memory allocator / VRAM management
        - Inference scheduler / batching
        - Signal handling / context teardown
        - Quantization / model loading
        - CLI / user interface (non-inference path)
        - Tooling / build system
        - Other (describe in Problem Statement)
    validations:
      required: true

  - type: textarea
    id: risks_and_tradeoffs
    attributes:
      label: Risks and Trade-offs
      description: What does this proposal make worse, even marginally? Identify correctness risks, complexity costs, or interactions with existing guarantees (e.g., signal safety, memory ordering).
      placeholder: |
        - Increased latency for single-token interactive use cases (N=1 path must be preserved as a fast path).
        - BatchEncoder adds state that must be correctly reset between inference calls — risk of stale batch data if Close() is not called between runs.
        - llama_batch pinning requires careful interaction with the GC; incorrect pinner scope would silently corrupt C-side memory.
    validations:
      required: false

  - type: textarea
    id: alternatives_considered
    attributes:
      label: Alternatives Considered
      description: What other approaches were evaluated and why were they rejected?
      placeholder: |
        1. C-side batching loop: rejected because it moves scheduling logic into C, making it harder to profile and test from Go.
        2. Increasing --n-batch at the CLI layer: rejected because it doesn't reduce CGo crossings, only changes the llama.cpp internal batch size.
    validations:
      required: false

  - type: textarea
    id: profiling_artifacts
    attributes:
      label: Profiling Artifacts
      description: Attach or link any pprof profiles, flamegraph SVGs, nsight traces, perf reports, or benchmark output that supports this proposal.
    validations:
      required: false
