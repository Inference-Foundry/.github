name: Bug Report
description: Report a reproducible defect in super-ollama. Incomplete reports — missing reproduction commands, hardware specs, or stack traces — will be closed without investigation.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Before You File
        - Search open and closed issues. Do not duplicate.
        - Reproduce the bug on the latest commit on `main` before filing.
        - Collect all logs, stack traces, and system specs **before** opening this form.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A precise, technical description of the defect. State what the system does versus what it should do. Do not editorialize.
      placeholder: "e.g., llama_context_p is not freed when SIGINT is received during the prefill phase. nvidia-smi shows persistent VRAM allocation after process exit."
    validations:
      required: true

  - type: textarea
    id: cli_command
    attributes:
      label: Exact CLI Command
      description: The exact terminal command that triggers the bug. Copy-paste it — do not paraphrase or redact flags.
      render: shell
      placeholder: |
        super-ollama run \
          --model /models/llama-3-8b-q4_K_M.gguf \
          --ctx-size 4096 \
          --n-gpu-layers 35 \
          --prompt "Explain GGUF tensor layout."
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Reproduction Steps
      description: Numbered, deterministic steps to reproduce from a clean state.
      placeholder: |
        1. Load model with --n-gpu-layers 35.
        2. Begin inference on a 4096-token prompt.
        3. Send SIGINT (Ctrl+C) within the first 2 seconds (during prefill).
        4. Run `nvidia-smi` immediately after process exit.
        5. Observe ~6 GiB VRAM still allocated despite process exit.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What the system should do according to its specification or correct engineering behavior.
      placeholder: "All ggml_backend_buffer_t allocations are released on SIGINT. nvidia-smi reports 0 MiB used by the process after exit."
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: Raw terminal output, error messages, and any anomalous behavior. Paste verbatim — do not summarize.
      render: shell
    validations:
      required: true

  - type: textarea
    id: stack_trace
    attributes:
      label: Stack Trace / Panic Output
      description: Paste the complete Go panic output, C++ segfault backtrace (from `gdb` or `lldb`), or ASAN report. This field exists specifically for crash data — do not leave it empty if the process crashed or panicked.
      render: shell
      placeholder: |
        goroutine 1 [running]:
        runtime/debug.Stack()
        	/usr/local/go/src/runtime/debug/stack.go:24 +0x5b
        main.main()
        	/home/user/super-ollama/cmd/super-ollama/main.go:87 +0x1a3
        ...

        --- or C++ segfault ---

        #0  0x00007f3c4a1b2345 in ggml_backend_free (backend=0x0)
        #1  0x00007f3c4a0c1234 in llama_backend_free ()
    validations:
      required: false

  - type: dropdown
    id: hardware_arch
    attributes:
      label: Hardware Architecture / Compute Backend
      description: Select the GPU vendor and the active compute backend.
      options:
        - Apple Silicon — Metal (M1 / M2 / M3 / M4)
        - NVIDIA — CUDA
        - AMD — ROCm / HIP
        - Intel — oneAPI / SYCL
        - CPU only (no GPU offload)
        - Other (describe in Additional Context)
    validations:
      required: true

  - type: input
    id: gpu_model
    attributes:
      label: GPU Model
      description: Exact model name, e.g. "NVIDIA RTX 4090", "AMD RX 7900 XTX", "Apple M3 Max".
      placeholder: "NVIDIA RTX 4090"
    validations:
      required: true

  - type: textarea
    id: driver_os_specs
    attributes:
      label: Driver and OS Specifications
      description: |
        Provide the following — paste exact command output where indicated:
        - **OS + kernel version** (`uname -r` on Linux; `sw_vers` on macOS)
        - **CUDA driver version** (`nvidia-smi` header line, e.g. "Driver Version: 550.54.15 / CUDA Version: 12.4")
        - **Metal / Xcode version** (`xcodebuild -version` on macOS)
        - **ROCm version** (`rocminfo | grep 'Runtime Version'` on AMD)
        - **Go version** (`go version`)
        - **Compiler version** (`clang --version` or `gcc --version`)
      placeholder: |
        OS: Ubuntu 22.04.4 LTS
        Kernel: 6.8.0-45-generic
        CUDA Driver: 550.54.15 / CUDA 12.4
        Go: go1.22.5 linux/amd64
        Clang: 18.1.3
    validations:
      required: true

  - type: textarea
    id: memory_state
    attributes:
      label: Memory State at Time of Crash
      description: |
        Report the following values captured as close to the crash as possible:
        - Total system RAM (GiB) and available RAM at crash time (`free -h`)
        - Total VRAM (GiB) and available VRAM at crash time (`nvidia-smi --query-gpu=memory.total,memory.free --format=csv` or equivalent)
        - The model loaded and its quantization (affects VRAM baseline)
      placeholder: |
        System RAM: 64 GiB total / 48 GiB available
        VRAM: 24 GiB total / 2.1 GiB available at crash
        Model: llama-3-8b-q4_K_M.gguf (4.92 GiB), --n-gpu-layers 35
    validations:
      required: true

  - type: input
    id: super_ollama_version
    attributes:
      label: super-ollama Version / Commit SHA
      description: Output of `super-ollama --version` or `git rev-parse HEAD`.
      placeholder: "v0.4.1 / a3f9c1d8"
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Hardware topology, NUMA configuration, custom build flags, relevant environment variables, or any other data that aids reproduction.
    validations:
      required: false
